name: Snake

on:
  schedule:
    - cron: "47 15 * * *" # 00:47 KST, once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      # Cells run from empty to ink in the wordmark's own greys; the snake is the wordmark's orange.
      # color_dots is five colours, empty cell first. Most active days land on the first level,
      # so that level is dark enough to tell apart from an empty cell.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#f0501a&color_dots=#eff2f5,#aeb7c0,#818b98,#59636e,#1f2328
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7a45&color_dots=#1c2128,#59626d,#9198a1,#c9d1d9,#f0f6fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Square the cells like everything else on the page. Cosmetic only: if the action
      # changes its markup this stops matching and the cells stay rounded.
      - name: Square the cells
        run: sed -i -E 's/(<rect class="c[^>]*) rx="2" ry="2"/\1/g' dist/github-snake.svg dist/github-snake-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
